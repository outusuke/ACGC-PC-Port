name: Android

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    name: Android-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.10.2

      - name: Fetch SDL2
        run: sh android/fetch-sdl.sh

      - name: Native build (all errors)
        continue-on-error: true
        run: |
          mkdir -p build/logs
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          cmake -S pc -B build/android-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DSDL2_SOURCE_DIR="$PWD/android/third_party/SDL2-2.32.10" 2>&1 | tee build/logs/native.log
          # -k 0 keeps ninja going past failures so every error is logged
          cmake --build build/android-native -- -k 0 2>&1 | tee -a build/logs/native.log

      - name: Build APK
        continue-on-error: true
        run: |
          mkdir -p build/logs
          gradle -p android assembleDebug --continue 2>&1 | tee build/logs/gradle.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs
          path: build/logs/*.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: AnimalCrossing-android-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
