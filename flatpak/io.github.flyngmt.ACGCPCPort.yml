app-id: io.github.flyngmt.ACGCPCPort
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Compat.i386
  - org.freedesktop.Sdk.Extension.toolchain-i386
command: acgc-pc-port

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --allow=multiarch

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 25.08;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;OpenCL/vendors;lib/dri;lib/d3d;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver

cleanup:
  - /include
  - /lib32/cmake
  - /lib32/pkgconfig
  - /share/aclocal
  - /bin/sdl2-config
  - '*.a'
  - '*.la'

# The decomp stores pointers in u32, so everything is built as i686.
x-i386-build-options: &i386-build-options
  no-debuginfo: true
  append-path: /usr/lib/sdk/toolchain-i386/bin
  ldflags: -L/app/lib32 -L/usr/lib/i386-linux-gnu
  env:
    CC: i686-unknown-linux-gnu-gcc
    CXX: i686-unknown-linux-gnu-g++
    PKG_CONFIG_PATH: /app/lib32/pkgconfig:/usr/lib/i386-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig

modules:
  - name: sdl2
    buildsystem: cmake-ninja
    builddir: true
    build-options: *i386-build-options
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib32
      - -DSDL_STATIC=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
        sha256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165

  - name: acgc-pc-port
    buildsystem: cmake-ninja
    subdir: pc
    build-options: *i386-build-options
    config-opts:
      # An empty build type keeps the project's own -O2 flags.
      - -DCMAKE_BUILD_TYPE=
      - -DSDL2_DIR=/app/lib32/cmake/SDL2
      - -DCMAKE_INSTALL_RPATH=/app/lib32
      - -DCMAKE_LIBRARY_PATH=/usr/lib/i386-linux-gnu
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo

  - name: acgc-pc-port-data
    buildsystem: simple
    build-commands:
      - install -Dm755 acgc-pc-port.sh /app/bin/acgc-pc-port
      - install -Dm644 io.github.flyngmt.ACGCPCPort.desktop -t /app/share/applications
      - install -Dm644 io.github.flyngmt.ACGCPCPort.metainfo.xml -t /app/share/metainfo
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/io.github.flyngmt.ACGCPCPort.png
      - mkdir -p /app/lib/i386-linux-gnu/GL
    sources:
      - type: file
        path: acgc-pc-port.sh
      - type: file
        path: io.github.flyngmt.ACGCPCPort.desktop
      - type: file
        path: io.github.flyngmt.ACGCPCPort.metainfo.xml
      - type: file
        path: ../pc/res/icon.png
        dest-filename: icon.png
