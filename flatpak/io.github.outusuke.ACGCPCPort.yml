app-id: io.github.outusuke.ACGCPCPort
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ac-pc-port

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /share/aclocal
  - /bin/sdl2-config

modules:
  - name: SDL2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.tar.gz
        sha256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165

  - name: ac-pc-port
    buildsystem: simple
    build-commands:
      - cmake -S pc -B _build -G Ninja -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_PREFIX_PATH=/app
      - cmake --build _build -j${FLATPAK_BUILDER_N_JOBS}
      - cmake --install _build
      - mkdir -p /app/share/ac-pc-port
      - mv /app/bin/shaders /app/share/ac-pc-port/shaders
      - install -Dm755 flatpak/ac-pc-port.sh /app/bin/ac-pc-port
      - install -Dm644 flatpak/io.github.outusuke.ACGCPCPort.desktop /app/share/applications/io.github.outusuke.ACGCPCPort.desktop
      - install -Dm644 pc/res/icon.png /app/share/icons/hicolor/512x512/apps/io.github.outusuke.ACGCPCPort.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
